{% extends "base.html" %}

{% block title %}{{ action }} Spare Part{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ action }} Spare Part</h1>
    <div class="page-subtitle">Add or update parts catalog, SKU identification, pricing, and reorder levels.</div>
  </div>
  <div>
    <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary btn-sm">&larr; Back to Inventory</a>
  </div>
</div>

<div class="card" style="max-width: 740px; margin: 0 auto;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="part-sku-input">Part SKU / Number *</label>
        <input type="text" class="form-control" id="part-sku-input" name="part_number" required placeholder="e.g. FLT-OIL-001" value="{{ part.part_number if part else '' }}" style="text-transform:uppercase; font-family:var(--font-mono);">
      </div>

      <div class="form-group">
        <label class="form-label" for="part-category-input">Category *</label>
        <input type="text" list="categories-list" class="form-control" id="part-category-input" name="category" required placeholder="e.g. Filters, Brakes, Fluids, Electrical" value="{{ part.category if part else '' }}">
        <datalist id="categories-list">
          <option value="Filters">
          <option value="Brakes">
          <option value="Fluids & Lubricants">
          <option value="Ignition & Spark">
          <option value="Electrical & Battery">
          <option value="Suspension & Steering">
          <option value="Tires & Wheels">
        </datalist>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="part-name-input">Part Name & Specifications *</label>
      <input type="text" class="form-control" id="part-name-input" name="name" required placeholder="e.g. Synthetic Engine Oil Filter PH7317" value="{{ part.name if part else '' }}">
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="part-cost-input">Purchase / Cost Price (₹)</label>
        <input type="number" step="0.01" min="0" class="form-control" id="part-cost-input" name="cost_price" placeholder="0.00" value="{{ part.cost_price if part else '0.00' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="part-selling-input">Retail / Selling Price (₹) *</label>
        <input type="number" step="0.01" min="0" class="form-control" id="part-selling-input" name="selling_price" required placeholder="0.00" value="{{ part.selling_price if part else '0.00' }}">
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="part-stock-input">Current Stock Quantity</label>
        <input type="number" min="0" class="form-control" id="part-stock-input" name="stock_quantity" value="{{ part.stock_quantity if part else '10' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="part-reorder-input">Min Safety Reorder Level</label>
        <input type="number" min="1" class="form-control" id="part-reorder-input" name="min_reorder_level" value="{{ part.min_reorder_level if part else '5' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="part-bin-input">Warehouse / Bin Location</label>
        <input type="text" class="form-control" id="part-bin-input" name="location_bin" placeholder="e.g. Bay A-12, Shelf 3" value="{{ part.location_bin if part else '' }}">
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
      <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary" id="btn-save-part">
        Save Spare Part
      </button>
    </div>
  </form>
</div>
{% endblock %}
